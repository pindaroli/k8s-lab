{{- range .Values.servers }}
{{- if and .enabled .rbac .rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ default (printf "%s-mcp" .name) .toolhive.name }}-crb
  labels:
    {{- include "mcp-gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: mcp-fleet
    mcp.stacklok.dev/server: {{ .name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default "cluster-admin" .rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ default (printf "%s-mcp" .name) .toolhive.name }}-sa
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- end }}
