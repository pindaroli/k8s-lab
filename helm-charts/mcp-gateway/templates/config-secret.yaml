apiVersion: v1
kind: Secret
metadata:
  name: mcp-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    servers:
    {{- range .Values.servers }}
      - name: {{ .name | quote }}
        url: {{ .url | quote }}
        {{- if .hostname }}
        hostname: {{ .hostname | quote }}
        {{- end }}
        enabled: {{ default true .enabled }}
        {{- if .prefix }}
        prefix: {{ .prefix | quote }}
        {{- end }}
    {{- end }}
