apiVersion: v1
kind: Service
metadata:
  name: mcp-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-broker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: grpc
      port: 50051
      protocol: TCP
      targetPort: 50051
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: mcp-broker-router
    component: broker-router
