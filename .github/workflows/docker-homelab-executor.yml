name: Build and Publish Homelab Executor Container

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'ansible/**'
      - 'secrets-sops/**'
      - 'schemas/mcp-tools.schema.json'
      - 'rete.json'
      - 'storage.json'
      - 'docker/homelab-executor/**'
      - '.github/workflows/docker-homelab-executor.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/docs/**'
      - '!**/tests/**'
      - 'docker/homelab-executor/requirements.txt'
      - 'scripts/**/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push homelab-executor to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: |
          BASE_VERSION=$(cat ./docker/homelab-executor/VERSION | tr -d ' \t\n\r')
          FULL_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "Building Homelab Executor Version: ${FULL_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homelab-executor
          tags: |
            type=raw,value=${{ steps.version.outputs.full_version }}
            type=raw,value=${{ steps.version.outputs.base_version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/homelab-executor/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.full_version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
