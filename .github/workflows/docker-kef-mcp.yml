name: Build and Publish KEF MCP Container

on:
  push:
    branches:
      - main
    paths:
      - 'docker/kef-mcp/**'
      - '.github/workflows/docker-kef-mcp.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Commit SHA, branch o tag di nqrwhal/kef-mcp da compilare'
        required: true
        default: 'main'
      image_tag:
        description: 'Tag semantico per l''immagine (es. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push kef-mcp to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Checkout Upstream kef-mcp
        uses: actions/checkout@v4
        with:
          repository: nqrwhal/kef-mcp
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: docker/kef-mcp/upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kef-mcp
          tags: |
            type=raw,value=${{ inputs.image_tag || '1.0.0' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/kef-mcp
          file: ./docker/kef-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
