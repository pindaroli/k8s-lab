apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-ui-ingress-route
  namespace: mcp-system
spec:
  entryPoints:
    - websecure
  routes:
    # 1. External / Public Access: OAuth2 Protected (Google Login via Traefik Middleware)
    - match: Host(`mcp-ui.pindaroli.org`)
      kind: Rule
      services:
        - name: mcp-inspector
          port: 6274
      middlewares:
        - name: oauth2-auth
          namespace: traefik

    # 2. Internal / LAN Direct Access: No OAuth2 Required
    - match: Host(`mcp-ui`) || Host(`mcp-ui-internal.pindaroli.org`)
      kind: Rule
      services:
        - name: mcp-inspector
          port: 6274
  tls:
    secretName: pindaroli-wildcard-tls
