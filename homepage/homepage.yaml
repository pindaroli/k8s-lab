---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: homepage
          image: "ghcr.io/gethomepage/homepage:v2.4.0"
          imagePullPolicy: Always
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home,home.pindaroli.org"
            - name: NODE_OPTIONS
              value: "--max-http-header-size=32768"
            - name: HOMEPAGE_MCP_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/config/custom.js
              name: homepage-config
              subPath: custom.js
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-content-type
  namespace: default
spec:
  contentType: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-cache-control
  namespace: default
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "no-cache, no-store, must-revalidate"
      Pragma: "no-cache"
      Expires: "0"
---
# External Access (OAuth2)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingress-external
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.pindaroli.org`) && PathPrefix(`/api/steam`)
      kind: Rule
      services:
        - name: proxmox-pve3
          port: 8006
          scheme: https
          serversTransport: skip-verify
      middlewares:
        - name: steam-api-rewrite
          namespace: default
        - name: steam-api-headers
          namespace: default
        - name: oauth2-auth
          namespace: traefik
    - match: Host(`home.pindaroli.org`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
      middlewares:
        - name: homepage-content-type
          namespace: default
        - name: homepage-cache-control
          namespace: default
        - name: oauth2-auth
          namespace: traefik
  tls:
    secretName: pindaroli-wildcard-tls

---
# TrueNAS su 10.10.20.50:443
apiVersion: v1
kind: Service
metadata:
  name: truenas-external
spec:
  ports:
  - port: 443
    targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-external-1
  labels:
    kubernetes.io/service-name: truenas-external
addressType: IPv4
ports:
  - port: 443
    protocol: TCP
endpoints:
  - addresses:
      - "10.10.20.50"
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas-route
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  # External / Public: OAuth Protected
  - match: Host(`nas.pindaroli.org`)
    kind: Rule
    services:
    - name: truenas-external
      port: 443
      scheme: https
      serversTransport: skip-verify
    middlewares:
    - name: oauth2-auth
      namespace: traefik
  # Internal / Short: Basic Auth (or No Auth)
  # NOTE: To use this, 'nas' must resolve to Traefik VIP (10.10.20.56) in DNS, not the Storage IP.
