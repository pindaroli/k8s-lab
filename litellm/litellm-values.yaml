replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "1.106.2"
  pullPolicy: IfNotPresent

db:
  deployStandalone: false
  useExisting: true
  endpoint: postgres-main-rw.cnpg-system.svc.cluster.local:5432
  database: litellm
  secret:
    name: litellm-secrets
    usernameKey: username
    passwordKey: password

masterkeySecretName: litellm-secrets
masterkeySecretKey: PROXY_MASTER_KEY

environmentSecrets:
  - litellm-secrets

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - talos-cp-01
                - talos-cp-02

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 2Gi

migrationJob:
  enabled: true

proxy_config:
  model_list:
    # 1. big-chat (qwen2.5:32b-instruct-q5_K_M)
    - model_name: big-chat
      litellm_params:
        model: ollama_chat/qwen2.5:32b-instruct-q5_K_M
        api_base: http://olindo-macstudio.pindaroli.org:11434
        order: 1
        timeout: 5
        stream_timeout: 10
    - model_name: big-chat
      litellm_params:
        model: ollama_chat/qwen2.5:32b-instruct-q5_K_M
        api_base: http://lxc-ollama.pindaroli.org:11434
        order: 2

    # 2. big-alt (gemma4:31b)
    - model_name: big-alt
      litellm_params:
        model: ollama_chat/gemma4:31b
        api_base: http://olindo-macstudio.pindaroli.org:11434
        order: 1
        timeout: 5
        stream_timeout: 10
    - model_name: big-alt
      litellm_params:
        model: ollama_chat/gemma4:31b
        api_base: http://lxc-ollama.pindaroli.org:11434
        order: 2

    # 3. vision (qwen3-vl:32b)
    - model_name: vision
      litellm_params:
        model: ollama_chat/qwen3-vl:32b
        api_base: http://olindo-macstudio.pindaroli.org:11434
        order: 1
        timeout: 5
        stream_timeout: 10
    - model_name: vision
      litellm_params:
        model: ollama_chat/qwen3-vl:32b
        api_base: http://lxc-ollama.pindaroli.org:11434
        order: 2

    # 4. vision-light (qwen2.5vl:7b-q4_K_M)
    - model_name: vision-light
      litellm_params:
        model: ollama_chat/qwen2.5vl:7b-q4_K_M
        api_base: http://olindo-macstudio.pindaroli.org:11434
        order: 1
        timeout: 5
        stream_timeout: 10
    - model_name: vision-light
      litellm_params:
        model: ollama_chat/qwen2.5vl:7b-q4_K_M
        api_base: http://lxc-ollama.pindaroli.org:11434
        order: 2

    # 5. embed (bge-m3:latest) - solo lxc-ollama
    - model_name: embed
      litellm_params:
        model: ollama/bge-m3:latest
        api_base: http://lxc-ollama.pindaroli.org:11434

  router_settings:
    enable_pre_call_checks: true
    routing_strategy: simple-shuffle
    num_retries: 2
    allowed_fails: 1
    cooldown_time: 60

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    database_url: os.environ/DATABASE_URL

extraResources:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: pindaroli-wildcard-tls
      namespace: litellm
    spec:
      secretName: pindaroli-wildcard-tls
      issuerRef:
        name: letsencrypt-cloudflare
        kind: ClusterIssuer
      dnsNames:
        - "pindaroli.org"
        - "*.pindaroli.org"

  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: litellm-internal
      namespace: litellm
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`litellm-internal.pindaroli.org`)
          kind: Rule
          services:
            - name: litellm
              port: 4000
      tls:
        secretName: pindaroli-wildcard-tls

  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: litellm-sync-hermes-key
      namespace: litellm
      annotations:
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          name: litellm-sync-hermes-key
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync-key
              image: curlimages/curl:8.10.1
              envFrom:
                - secretRef:
                    name: litellm-secrets
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for LiteLLM to be ready..."
                  until curl -s -f http://litellm.litellm.svc.cluster.local:4000/health/liveliness; do
                    sleep 2
                  done
                  echo "LiteLLM is ready. Registering Hermes virtual key..."
                  STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST http://litellm.litellm.svc.cluster.local:4000/key/generate \
                    -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                    -H "Content-Type: application/json" \
                    -d "{\"key\": \"$HERMES_VIRTUAL_KEY\", \"key_alias\": \"hermes\", \"models\": [\"big-chat\", \"big-alt\", \"vision\", \"vision-light\", \"embed\"]}")
                  cat /tmp/resp.json
                  echo ""
                  if [ "$STATUS" = "200" ]; then
                    echo "Hermes virtual key registered successfully."
                    exit 0
                  fi
                  echo "Key generation returned $STATUS, attempting update..."
                  UPDATE_STATUS=$(curl -s -o /tmp/resp_update.json -w "%{http_code}" -X POST http://litellm.litellm.svc.cluster.local:4000/key/update \
                    -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                    -H "Content-Type: application/json" \
                    -d "{\"key\": \"$HERMES_VIRTUAL_KEY\", \"key_alias\": \"hermes\", \"models\": [\"big-chat\", \"big-alt\", \"vision\", \"vision-light\", \"embed\"]}")
                  cat /tmp/resp_update.json
                  echo ""
                  if [ "$UPDATE_STATUS" = "200" ]; then
                    echo "Hermes virtual key updated successfully."
                    exit 0
                  fi
                  echo "Finished with status $UPDATE_STATUS."
                  exit 0
