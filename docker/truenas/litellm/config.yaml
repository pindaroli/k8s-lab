router_settings:
  model_group_alias:
    chat: big-chat
  allowed_fails: 1
  cooldown_time: 30

general_settings:
  pass_through_endpoints:
    - path: "/v1/models"
      auth: false
    - path: "/models"
      auth: false

litellm_settings:
  drop_params: true
