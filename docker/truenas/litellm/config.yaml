model_list:
  # 1. big-chat (qwen2.5:32b-instruct-q5_K_M)
  - model_name: big-chat
    litellm_params:
      model: ollama_chat/qwen2.5:32b-instruct-q5_K_M
      api_base: http://olindo-macstudio.pindaroli.org:11434
      order: 1
      timeout: 120
      stream_timeout: 60
