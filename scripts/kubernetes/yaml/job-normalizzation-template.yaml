apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${NORMALIZATION_TYPE}-normalizer
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - qbittorrent
              topologyKey: kubernetes.io/hostname
      containers:
        - name: normalizer
          image: ghcr.io/pindaroli/custom-normalizer:1.2.5
          imagePullPolicy: Always
          command:
            - "${COMMAND}"
          args:
            - "${DIR}"
            - "${DEST_DIR}"
            - "/media"
            - "${EMAIL_RECIPIENT}"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: LANG
              value: "C.UTF-8"
            - name: LC_ALL
              value: "C.UTF-8"
            - name: SONGKONG_VERBOSE
              value: "${SONGKONG_VERBOSE}"
            - name: EMAIL_RECIPIENT
              value: "${EMAIL_RECIPIENT}"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: smtp-port
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: smtp-user
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: smtp-pass
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: smtp-creds
                  key: smtp-from
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: servarr-api-keys
                  key: telegram-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: servarr-api-keys
                  key: telegram-chat-id
          volumeMounts:
            - name: media-data
              mountPath: /media
            - name: songkong-license
              mountPath: /root/.songkong/license.properties
              subPath: license.properties
            - name: filebot-license
              mountPath: /root/.filebot/license.psm
              subPath: license.psm
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: servarr-jellyfin-media
        - name: songkong-license
          secret:
            secretName: songkong-license
        - name: filebot-license
          secret:
            secretName: filebot-license
            optional: true
