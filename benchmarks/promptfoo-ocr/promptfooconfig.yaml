# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Benchmark OCR Qwen2.5-VL 7B - Test Dettagliato Voci e Tabella"

providers:
  - id: "openai:chat:qwen2.5vl:7b-q4_K_M"
    label: "mac-local:qwen2.5vl:7b"
    config:
      apiBaseUrl: "http://127.0.0.1:11434/v1"
      apiKey: "ollama"
      temperature: 0.0
      max_tokens: 4096

prompts:
  - "file://prompts/image_prompt.json"

tests:
  - description: "OCR Fattura Elettronica - Test Accuratezza e Layout Tabellare"
    vars:
      question: "Trascrivi integralmente il seguente documento in formato Markdown pulito. Preserva la struttura esatta di ogni tabella e tutte le voci articolo."
      image_url: "data:image/png;base64,"
    assert:
      - type: icontains
        value: "FATTURA"
      - type: icontains
        value: "Totale Euro"
      - type: icontains
        value: "1464"
      - type: icontains
        value: "Mini-PC AMD Ryzen"
      - type: icontains
        value: "NVMe PCIe"
      - type: icontains
        value: "Cavo DAC"
      - type: javascript
        value: "output.includes('|') && output.includes('---')"

  - description: "OCR Scontrino Commerciale - Test Riconoscimento Voci, Prezzi e Totale"
    vars:
      question: "Trascrivi integralmente ogni singola voce, quantità e prezzo dello scontrino in formato Markdown con una tabella strutturata."
      image_url: "data:image/jpeg;base64,"
    assert:
      - type: icontains
        value: "CAFFETTERIA"
      - type: icontains
        value: "CAFFE ESPRESSO"
      - type: icontains
        value: "1.30"
      - type: icontains
        value: "BRIOCHE ARTIGIANALI"
      - type: icontains
        value: "3.40"
      - type: icontains
        value: "SPREMUTA D ARANCIA"
      - type: icontains
        value: "4.00"
      - type: icontains
        value: "8.70"
      - type: javascript
        value: "output.includes('|') && output.includes('---')"
