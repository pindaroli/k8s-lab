# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Benchmark OCR Qwen2.5-VL 7B OpenAI Vision Data URI"

providers:
  - id: "openai:chat:qwen2.5vl:7b-q4_K_M"
    label: "mac-local:qwen2.5vl:7b"
    config:
      apiBaseUrl: "http://127.0.0.1:11434/v1"
      apiKey: "ollama"
      temperature: 0.0
      max_tokens: 4096

prompts:
  - "file://prompts/image_prompt.json"

tests:
  - description: "OCR Fattura Elettronica - Test Accuratezza e Layout Tabellare"
    vars:
      question: "Trascrivi integralmente il seguente documento in formato Markdown pulito. Preserva la struttura esatta di ogni tabella."
      image_url: "file://fixtures/fattura_test.b64"
    assert:
      # Verifica presenza di elementi chiave nel testo estratto
      - type: icontains
        value: "FATTURA"
      - type: icontains
        value: "Totale Euro"
      - type: icontains
        value: "1464"
      # Verifica che abbia estratto una tabella Markdown valida
      - type: javascript
        value: "output.includes('|') && output.includes('---')"

  - description: "OCR Scontrino Commerciale - Test Riconoscimento Voci e Totale"
    vars:
      question: "Trascrivi integralmente il seguente documento in formato Markdown pulito. Preserva la struttura esatta di ogni tabella."
      image_url: "file://fixtures/ricevuta_test.b64"
    assert:
      - type: icontains
        value: "CAFFETTERIA"
      - type: icontains
        value: "8.70"
