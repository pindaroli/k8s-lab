---
- name: EXOS - Elenco VLAN e Associazioni Porte
  hosts: switches
  gather_facts: no
  vars_files:
    - "../vars/switch_extreme_secrets.enc.yaml"

  vars:
    ansible_network_os: extreme.exos.exos
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_cli_ssh_type: paramiko
    ansible_ssh_common_args: '-o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa'

  tasks:
    - name: 1. Esegui i comandi 'show vlan' e 'show vlan detail' su EXOS
      extreme.exos.exos_command:
        commands:
          - show vlan
          - show vlan detail
      register: vlan_info

    - name: 2. Mostra il riepilogo generale delle VLAN
      ansible.builtin.debug:
        var: vlan_info.stdout_lines[0]

    - name: 3. Mostra l'associazione dettagliata tra VLAN e Porte
      ansible.builtin.debug:
        var: vlan_info.stdout_lines[1]
