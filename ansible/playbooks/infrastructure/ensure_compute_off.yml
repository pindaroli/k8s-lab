---
# ==============================================================================
# 🛑 ENSURE COMPUTE OFF: SPEGNIMENTO IDEMPOTENTE TALOS KUBERNETES + PROXMOX VE
# ==============================================================================
# 1. Shutdown Graceful Kubernetes (Cordon, CNPG DB Checkpoint, talosctl shutdown)
# 2. Gate chiusura porte Talos e API Server K8s (VIP 10.10.20.55:6443)
# 3. Shutdown Fisico ACPI Hypervisor Proxmox VE (PVE3, PVE2 poi PVE1)
# 4. Gate spegnimento porte SSH (22) e WebUI (8006) Proxmox VE
# ==============================================================================

# ------------------------------------------------------------------------------
# FASE 1: SHUTDOWN GRACEFUL KUBERNETES
# ------------------------------------------------------------------------------
- name: "⚡ FASE 1: Shutdown Graceful Cluster Kubernetes (Talos)"
  tags: [k8s, compute_off]
  hosts: localhost
  gather_facts: no
  vars:
    talos_nodes: "10.10.20.141,10.10.20.142,10.10.20.143"
    api_endpoint: "10.10.20.141"
    k8s_vip: "10.10.20.55"
    traefik_vip: "10.10.20.56"
  tasks:
    - name: "🔔 Inizio procedura spegnimento K8s e PVE"
      debug:
        msg: "Verifica stato ed eventuale spegnimento di Kubernetes e Proxmox VE..."

    - name: "🔍 Probe Idempotente: Verifica se Kubernetes API Server è attivo (Porta 6443)"
      wait_for:
        host: "{{ k8s_vip }}"
        port: 6443
        state: started
        timeout: 2
      register: k8s_probe
      failed_when: false

    - name: "Definisci stato Kubernetes (Online / Offline)"
      set_fact:
        k8s_is_online: "{{ 'port' in k8s_probe and 'Timeout' not in (k8s_probe.msg | default('')) }}"

    - name: "ℹ️ Stato rilevamento Kubernetes Cluster"
      debug:
        msg: "{{ 'Cluster K8s ONLINE: procedo con cordon, checkpoint e shutdown' if k8s_is_online else 'Cluster K8s GIÀ OFFLINE: skip cordon, checkpoint, talosctl shutdown e gate attesa porte' }}"

    - name: "🛡️ Cordon globale nodi Talos (Previene rescheduling dei pod)"
      command: kubectl cordon talos-cp-01 talos-cp-02 talos-cp-03
      register: cordon_result
      when: k8s_is_online
      ignore_errors: true

    - name: "💾 Quiesce / Checkpoint Database PostgreSQL (CNPG)"
      shell: >
        PG_PRIMARY=$(kubectl get pods -n cnpg-system -l cnpg.io/cluster=postgres-main,cnpg.io/instanceRole=primary -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true);
        if [ -n "$PG_PRIMARY" ]; then
          kubectl exec -n cnpg-system -c postgres "$PG_PRIMARY" -- psql -U postgres -c "CHECKPOINT;"
        fi
      register: pg_checkpoint
      when: k8s_is_online
      failed_when: false
      changed_when: false

    - name: "🔥 Invia segnale di spegnimento parallelo Talos OS"
      command: >
        talosctl shutdown --nodes {{ talos_nodes }} --endpoints {{ api_endpoint }} --force --wait=false
      register: shutdown_signal
      when: k8s_is_online
      ignore_errors: true

    - name: "⏳ Gate 1.1: Attesa chiusura porte API Talos (Porta 50000)"
      wait_for:
        host: "{{ item }}"
        port: 50000
        state: stopped
        timeout: 90
      loop:
        - 10.10.20.141
        - 10.10.20.142
        - 10.10.20.143
      when: k8s_is_online

    - name: "⏳ Gate 1.2: Verifica chiusura API Server K8s (VIP 10.10.20.55:6443)"
      wait_for:
        host: "{{ k8s_vip }}"
        port: 6443
        state: stopped
        timeout: 30
      when: k8s_is_online

    - name: "⏳ Gate 1.3: Verifica chiusura Traefik Ingress (VIP 10.10.20.56:443)"
      wait_for:
        host: "{{ traefik_vip }}"
        port: 443
        state: stopped
        timeout: 30
      when: k8s_is_online

    - name: "✅ Gate 1 Superato: Cluster Kubernetes e Ingress ufficialmente OFFLINE"
      debug:
        msg: "Kubernetes è spento in sicurezza."
      when: k8s_is_online

    - name: "🔔 Notifica Telegram: K8s Spento"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "⚫ <b>Kubernetes Cluster Spento</b>: Talos nodes disattivati e workload salvaguardati"'
      when: k8s_is_online
      changed_when: false

# ------------------------------------------------------------------------------
# FASE 2: SHUTDOWN FISICO HYPERVISOR PROXMOX VE
# ------------------------------------------------------------------------------
- name: "🔌 FASE 2: Shutdown Fisico Hypervisor Proxmox VE"
  tags: [pve, compute_off]
  hosts: localhost
  gather_facts: no
  vars:
    pve_satellites:
      - { name: "pve3", ip: "10.10.10.31" }
      - { name: "pve2", ip: "10.10.10.21" }
    pve_master: { name: "pve1", ip: "10.10.10.11" }
    pve_all_hosts:
      - "10.10.10.31"
      - "10.10.10.21"
      - "10.10.10.11"
  tasks:
    - name: "🔍 Probe Idempotente: Verifica stato nodi Satellite (PVE3, PVE2) (Porta 22)"
      wait_for:
        host: "{{ item.ip }}"
        port: 22
        state: started
        timeout: 2
      register: pve_sat_probe
      failed_when: false
      loop: "{{ pve_satellites }}"

    - name: "Invia segnale di spegnimento ACPI ai nodi Satellite ancora online"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ item.item.ip }} "shutdown -h now"
      when: "'port' in item and 'Timeout' not in (item.msg | default(''))"
      loop: "{{ pve_sat_probe.results }}"
      ignore_errors: true

    - name: "🔍 Probe Idempotente: Verifica stato nodo Master (PVE1) (Porta 22)"
      wait_for:
        host: "{{ pve_master.ip }}"
        port: 22
        state: started
        timeout: 2
      register: pve_master_probe
      failed_when: false

    - name: "Invia segnale di spegnimento ACPI al nodo Master (PVE1) se ancora online"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve_master.ip }} "shutdown -h now"
      when: "'port' in pve_master_probe and 'Timeout' not in (pve_master_probe.msg | default(''))"
      ignore_errors: true

    - name: "Definisci se almeno un nodo Proxmox VE era online"
      set_fact:
        pve_any_online: "{{ ('port' in pve_master_probe and 'Timeout' not in (pve_master_probe.msg | default(''))) or (pve_sat_probe.results | selectattr('port', 'defined') | rejectattr('msg', 'search', 'Timeout') | list | length > 0) }}"

    - name: "ℹ️ Stato rilevamento Proxmox VE Cluster"
      debug:
        msg: "{{ 'Hypervisors PVE ONLINE: procedo con attesa spegnimento e gate' if pve_any_online else 'Hypervisors PVE GIÀ OFFLINE: skip gate attesa porte e notifica' }}"

    - name: "⏳ Gate 2.1: Attesa spegnimento nodi Proxmox (Porta SSH 22 STOPPED)"
      wait_for:
        host: "{{ item }}"
        port: 22
        state: stopped
        timeout: 120
      loop: "{{ pve_all_hosts }}"
      when: pve_any_online

    - name: "⏳ Gate 2.2: Verifica spegnimento WebUI Proxmox (Porta 8006 STOPPED)"
      wait_for:
        host: "{{ item }}"
        port: 8006
        state: stopped
        timeout: 30
      loop: "{{ pve_all_hosts }}"
      when: pve_any_online

    - name: "✅ Gate 2 Superato: Tutti i 3 server fisici Proxmox sono spenti"
      debug:
        msg: "Hypervisor pve1, pve2 e pve3 disattivati con successo."
      when: pve_any_online

    - name: "🔔 Notifica Telegram: Hypervisors PVE Spenti"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "⚫ <b>Hypervisors PVE Spenti</b>: pve1, pve2, pve3 disattivati in sicurezza"'
      when: pve_any_online
      changed_when: false

    - name: "🏁 COMPUTE LAYER OFFLINE"
      debug:
        msg: |
          ============================================================
          🌙 COMPUTE OFFLINE: KUBERNETES E PROXMOX VE DISATTIVATI
          ============================================================
          - Kubernetes:    OFFLINE (Talos spento)
          - Hypervisors:   OFFLINE (pve1, pve2, pve3 spenti)
          ============================================================
