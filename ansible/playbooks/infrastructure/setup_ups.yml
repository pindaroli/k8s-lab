---
- name: 🔌 SETUP UPS NUT MASTER ON TRUENAS (USB Host) 🔌
  hosts: truenas
  remote_user: olindo
  gather_facts: no
  become: yes

  vars_files:
    - ../vars/secrets.yml

  vars:
    ups_mon_pwd: "{{ vault_ups_mon_password | default('upsmon_local_secure_pwd_123') }}"
    ups_admin_pwd: "{{ vault_ups_admin_password | default('ups_admin_secure_pwd_789') }}"

  tasks:
    - name: "TrueNAS: Configure UPS in Master mode via midclt (USB Tecnoware Exa 1000)"
      command: >
        midclt call ups.update '{
          "mode": "MASTER",
          "identifier": "ups",
          "driver": "nutdrv_qx$(Various USB)",
          "port": "auto",
          "description": "Tecnoware Exa 1000",
          "options": "vendorid = 0665\nproductid = 5161\nignorelb\noverride.battery.charge.low = 40\n",
          "rmonitor": true,
          "remoteport": 3493,
          "monuser": "upsmon",
          "monpwd": "{{ ups_mon_pwd }}",
          "extrausers": "[pvemon]\n  password = {{ ups_mon_pwd }}\n  upsmon slave\n",
          "shutdown": "BATT",
          "shutdowntimer": 30,
          "hostsync": 120,
          "powerdown": false
        }'
      register: truenas_ups_config
      changed_when: true

    - name: "TrueNAS: Enable UPS service on boot"
      command: midclt call service.update "ups" '{"enable":true}'
      changed_when: true

    - name: "TrueNAS: Restart UPS service"
      command: midclt call service.restart "ups"
      changed_when: true


- name: 🧹 BONIFICA COMPONENTI SERVER NUT SU PVE1 🧹
  hosts: 10.10.10.11
  remote_user: root
  gather_facts: no
  become: yes

  tasks:
    - name: "PVE1: Stop & disable nut-server and nut-driver services"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - nut-server
        - nut-driver@ups
        - nut-driver-enumerator.path
        - nut-driver-enumerator.service
      ignore_errors: yes

    - name: "PVE1: Remove obsolete USB udev rule (0665:5161 is on TrueNAS)"
      file:
        path: /etc/udev/rules.d/99-nut-ups.rules
        state: absent

    - name: "PVE1: Reload udev rules"
      command: udevadm control --reload-rules
      changed_when: false

    - name: "PVE1: Cleanup stale server PID files"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /run/nut/upsd.pid
        - /run/nut/usbhid-ups-ups.pid
        - /run/nut/nutdrv_qx-ups.pid
      ignore_errors: yes

    - name: "PVE1: Neutralize legacy server config files"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nut/ups.conf
        - /etc/nut/upsd.conf
        - /etc/nut/upsd.users

    - name: "PVE1: Purge obsolete nut-server package"
      apt:
        name: nut-server
        state: absent
        purge: yes
      ignore_errors: yes


- name: 🔌 SETUP DISTRIBUITO NUT CLIENT SU TUTTO IL CLUSTER PROXMOX (PVE1, PVE2, PVE3) 🔌
  hosts: proxmox
  remote_user: root
  gather_facts: no
  become: yes

  vars_files:
    - "../../vars/common_secrets.yml"
    - "../../vars/system_secrets.yml"

  vars:
    ups_mon_pwd: "{{ vault_ups_mon_password | default('upsmon_local_secure_pwd_123') }}"

  tasks:
    - name: "Proxmox: Ensure NUT client package is installed"
      apt:
        name:
          - nut-client
        state: present
        update_cache: yes

    - name: "Proxmox: Configure /etc/nut/nut.conf in netclient mode"
      copy:
        content: |
          MODE=netclient
        dest: /etc/nut/nut.conf
        owner: root
        group: nut
        mode: '0640'

    - name: "Proxmox: Configure /etc/nut/upsmon.conf monitoring TrueNAS Master"
      copy:
        content: |
          MONITOR ups@10.10.10.50 1 pvemon {{ ups_mon_pwd }} slave
          MINSUPPLIES 1
          SHUTDOWNCMD "/etc/nut/shutdown_sequence.sh"
          POWERDOWNFLAG /etc/killpower
          NOTIFYCMD /usr/sbin/upssched
          NOTIFYFLAG ONLINE SYSLOG+WALL
          NOTIFYFLAG ONBATT SYSLOG+WALL
          NOTIFYFLAG LOWBATT SYSLOG+WALL
        dest: /etc/nut/upsmon.conf
        owner: root
        group: nut
        mode: '0640'

    - name: "Proxmox: Deploy atomic local /etc/nut/shutdown_sequence.sh"
      copy:
        content: |
          #!/bin/bash
          # Script di spegnimento locale attivato da NUT Client (Master: TrueNAS 10.10.10.50)
          echo "[$(date)] Blackout / LOWBATT rilevato da TrueNAS! Avvio spegnimento locale..."

          {% if talos_vmid is defined %}
          echo "[$(date)] Spegnimento pulito Talos VM {{ talos_vmid }}..."
          qm shutdown {{ talos_vmid }} || true
          TIMEOUT=45; COUNT=0
          while qm status {{ talos_vmid }} 2>/dev/null | grep -q "status: running"; do
              sleep 2; COUNT=$((COUNT+2))
              if [ $COUNT -ge $TIMEOUT ]; then
                  echo "[$(date)] Timeout superato, forzatura stop..."
                  qm stop {{ talos_vmid }} || true
                  break
              fi
          done
          {% endif %}

          {% if inventory_hostname == '10.10.10.21' %}
          echo "[$(date)] Spegnimento carichi ausiliari LXC..."
          pct shutdown 2200 || true
          {% endif %}

          echo "[$(date)] Spegnimento del nodo host {{ inventory_hostname }}..."
          poweroff
        dest: /etc/nut/shutdown_sequence.sh
        owner: root
        group: root
        mode: '0755'

    - name: "Proxmox: Restart & enable nut-client service"
      systemd:
        name: nut-client
        state: restarted
        enabled: yes
