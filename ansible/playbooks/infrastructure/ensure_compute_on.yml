---
# ==============================================================================
# ⚡ ENSURE COMPUTE ON: AVVIO E SINCRONIZZAZIONE PROXMOX VE + TALOS KUBERNETES
# ==============================================================================
# 1. WoL Idempotente Hypervisor Proxmox VE (pve1, pve2, pve3)
# 2. Gate SSH (22) e WebUI (8006) Proxmox VE
# 3. Verifica e auto-avvio idempotente VM Talos (1300, 2300, 3200) se spente
# 4. Gate Talos API (50000) e Kubernetes VIP (10.10.20.55:6443)
# 5. Sync Barrier: attesa contemporanea Ready=True su tutti i nodi Talos
# 6. Uncordon atomico parallelo (apertura bilanciata dello scheduling K8s)
# 7. Health-Check Ingress Traefik (443) e Database PostgreSQL CNPG
# ==============================================================================

- name: "⚡ ENSURE COMPUTE ON: Proxmox VE + Talos Kubernetes"
  tags: [pve, k8s, compute_on]
  hosts: localhost
  gather_facts: no
  vars:
    pve_nodes_map:
      - { name: "pve1", ip: "10.10.10.11", vmid: "1300" }
      - { name: "pve2", ip: "10.10.10.21", vmid: "2300" }
      - { name: "pve3", ip: "10.10.10.31", vmid: "3200" }
    pve_hosts:
      - 10.10.10.11 # pve1
      - 10.10.10.21 # pve2
      - 10.10.10.31 # pve3
    talos_nodes:
      - 10.10.20.141 # talos-cp-01
      - 10.10.20.142 # talos-cp-02
      - 10.10.20.143 # talos-cp-03
    k8s_vip: "10.10.20.55"
    traefik_vip: "10.10.20.56"
  tasks:
    - name: "🔔 Inizio verifica / avvio Compute Layer (Proxmox + K8s)"
      debug:
        msg: "Verifica stato Proxmox VE e cluster Kubernetes..."

    # --------------------------------------------------------------------------
    # FASE 0: WAKE-ON-LAN (WoL) IDEMPOTENTE HYPERVISOR PROXMOX VE
    # --------------------------------------------------------------------------
    - name: "🔍 Probe Idempotente: Verifica se i nodi Proxmox sono già accesi (Porta 22)"
      wait_for:
        host: "{{ item.ip }}"
        port: 22
        state: started
        timeout: 2
      register: pve_probe
      failed_when: false
      loop: "{{ pve_nodes_map }}"

    - name: "ℹ️ Stato rilevamento nodi Proxmox"
      debug:
        msg: >-
          Nodo {{ item.item.name }} ({{ item.item.ip }}):
          {{ 'GIÀ ONLINE (SKIP WoL)' if ('port' in item and 'Timeout' not in (item.msg | default(''))) else 'OFFLINE (Invio Magic Packet WoL)' }}
      loop: "{{ pve_probe.results }}"

    - name: "⚡ WoL Idempotente: Invio Magic Packet ai nodi Proxmox spenti"
      command: "python3 {{ playbook_dir }}/../../../scripts/network/wake_node.py {{ item.item.name }}"
      when: "'port' not in item or 'Timeout' in (item.msg | default(''))"
      loop: "{{ pve_probe.results }}"

    # --------------------------------------------------------------------------
    # FASE 1: ATTESA E VERIFICA HYPERVISOR PROXMOX VE
    # --------------------------------------------------------------------------
    - name: "⏳ Gate 1.1: Attesa raggiungibilità SSH nodi Proxmox VE (Porta 22)"
      wait_for:
        host: "{{ item }}"
        port: 22
        state: started
        timeout: 180
      loop: "{{ pve_hosts }}"

    - name: "⏳ Gate 1.2: Verifica raggiungibilità WebUI Proxmox VE (Porta 8006)"
      wait_for:
        host: "{{ item }}"
        port: 8006
        state: started
        timeout: 180
      loop: "{{ pve_hosts }}"

    - name: "✅ Gate 1 Superato: Gli Hypervisor Proxmox VE sono online"
      debug:
        msg: "Hypervisor pve1, pve2 e pve3 operativi."

    # --------------------------------------------------------------------------
    # FASE 1.5: AUTO-START IDEMPOTENTE VM TALOS SE SPENTE
    # --------------------------------------------------------------------------
    - name: "🔍 Idempotenza VM Talos: Verifica e avvio VM su Proxmox se spente"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ item.ip }} "qm status {{ item.vmid }} | grep -q running || qm start {{ item.vmid }}"
      loop: "{{ pve_nodes_map }}"
      changed_when: false
      ignore_errors: true

    - name: "🔔 Notifica Telegram: Hypervisor PVE Online"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "✅ <b>PVE Hypervisors Online</b>: pve1, pve2, pve3 operativi (SSH 22 e WebUI 8006)"'
      changed_when: false

    # --------------------------------------------------------------------------
    # FASE 2: ATTESA API TALOS OS & KUBERNETES VIP
    # --------------------------------------------------------------------------
    - name: "⏳ Gate 2.1: Attesa apertura porte API Talos OS (Porta 50000)"
      wait_for:
        host: "{{ item }}"
        port: 50000
        state: started
        timeout: 180
      loop: "{{ talos_nodes }}"

    - name: "⏳ Gate 2.2: Attesa apertura API Server Kubernetes (VIP 10.10.20.55:6443)"
      wait_for:
        host: "{{ k8s_vip }}"
        port: 6443
        state: started
        timeout: 180

    - name: "✅ Gate 2 Superato: Talos API e Kubernetes API Server rispondono"
      debug:
        msg: "Control plane K8s raggiungibile sul VIP 10.10.20.55."

    - name: "🔔 Notifica Telegram: Talos & Kubernetes API Ready"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "✅ <b>Control Plane K8s Online</b>: Talos API e Kubernetes API Server operativi su VIP 10.10.20.55:6443"'
      changed_when: false

    # --------------------------------------------------------------------------
    # FASE 3: SYNC BARRIER - ATTESA STATO READY SIMULTANEO DEI NODI
    # --------------------------------------------------------------------------
    - name: "🛡️ Gate 3.1: Attesa che tutti i nodi siano Ready (Sync Barrier anti-valanga)"
      shell: >
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{":Ready="}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{" "}{end}'
      register: nodes_ready_check
      until: >
        'talos-cp-01:Ready=True' in nodes_ready_check.stdout and
        'talos-cp-02:Ready=True' in nodes_ready_check.stdout and
        'talos-cp-03:Ready=True' in nodes_ready_check.stdout
      retries: 30
      delay: 10
      changed_when: false

    - name: "⏳ Gate 3.2: Grace Period stabilizzazione rete CNI / Flannel (10s)"
      pause:
        seconds: 10

    - name: "✅ Gate 3 Superato: Tutti i 3 nodi Talos sono Ready e stabilizzati"
      debug:
        msg: "Barriera di sincronizzazione superata: i nodi worker sono pronti a ricevere il carico."

    - name: "🔔 Notifica Telegram: Sync Barrier Superata"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "✅ <b>Sync Barrier Superata</b>: Tutti i nodi Talos (cp-01, cp-02, cp-03) sono contemporaneamente Ready e stabilizzati"'
      changed_when: false

    # --------------------------------------------------------------------------
    # FASE 4: UNCORDON ATOMICO E SIMULTANEO
    # --------------------------------------------------------------------------
    - name: "🚀 Uncordon atomico parallelo nodi Talos (Apertura bilanciata dello scheduling)"
      command: kubectl uncordon talos-cp-01 talos-cp-02 talos-cp-03
      register: uncordon_result
      changed_when: "'already uncordoned' not in uncordon_result.stdout"

    - name: "📋 Output Uncordon"
      debug:
        var: uncordon_result.stdout_lines

    - name: "🔔 Notifica Telegram: Uncordon Atomico Eseguito"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "🚀 <b>Uncordon Atomico Eseguito</b>: Scheduling K8s aperto in modo bilanciato su tutti i nodi"'
      changed_when: false

    # --------------------------------------------------------------------------
    # FASE 5: HEALTH-CHECK E STATO CLUSTER POST-STARTUP
    # --------------------------------------------------------------------------
    - name: "⏳ Gate 5.1: Verifica riapertura Traefik Ingress (VIP 10.10.20.56:443)"
      wait_for:
        host: "{{ traefik_vip }}"
        port: 443
        state: started
        timeout: 120

    - name: "💾 Gate 5.2: Verifica salute cluster PostgreSQL CNPG"
      shell: kubectl get cluster postgres-main -n cnpg-system -o jsonpath='{.status.phase}'
      register: cnpg_status
      until: cnpg_status.stdout == "Cluster in healthy state"
      retries: 15
      delay: 5
      changed_when: false
      ignore_errors: true

    - name: "🔔 Notifica Telegram: Health Check Superato"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "✅ <b>Health-Check Superato</b>: Traefik Ingress VIP (443) e Cluster CNPG Database sani e operativi"'
      changed_when: false

    - name: "🏁 COMPUTE LAYER ONLINE"
      debug:
        msg: |
          ============================================================
          🎉 COMPUTE ONLINE: PROXMOX VE E TALOS KUBERNETES OPERATIVI
          ============================================================
          - Hypervisor PVE: ONLINE (pve1, pve2, pve3)
          - Talos Nodi:     READY & UNCORDONATI (Scheduling bilanciato)
          - Ingress VIP:    ONLINE (https://10.10.20.56)
          - Database CNPG:  {{ cnpg_status.stdout | default('Verificato') }}
          ============================================================
