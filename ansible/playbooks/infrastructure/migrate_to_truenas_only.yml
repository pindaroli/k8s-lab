---
# ==============================================================================
# 🛑 PLAYBOOK DI MIGRAZIONE A CONFIGURAZIONE SOLO TRUENAS (FAILOVER)
# ==============================================================================
# Procedura dichiarativa e deterministica con gate bloccanti sequenziali:
# FASE 1: Shutdown Graceful Kubernetes (Talos) e verifica gate
# FASE 2: Arresto Graceful LXC Jellyfin 12 (2200) su PVE3 e Allineamento DB
# FASE 3: Preparazione Storage Isolato Jellyfin 12 (-truenas) e Tuning AMD Vega / LAN
# FASE 4: Shutdown Graceful Cluster Fisico Proxmox VE (pve3, pve2, pve1)
# FASE 5: Sincronizzazione Stack con Homepage Failover e Avvio Docker Compose su TrueNAS
# ==============================================================================

# ==============================================================================
# FASE 1: SHUTDOWN GRACEFUL CLUSTER KUBERNETES (TALOS)
# ==============================================================================
- name: "⚡ FASE 1: Shutdown Graceful Cluster Kubernetes (Talos)"
  hosts: localhost
  gather_facts: no
  vars:
    talos_nodes: "10.10.20.141,10.10.20.142,10.10.20.143"
    api_endpoint: "10.10.20.141"
    k8s_vip: "10.10.20.55"
    traefik_vip: "10.10.20.56"
  tasks:
    - name: "🔔 Notifica: Inizio procedura di migrazione a Solo TrueNAS"
      debug:
        msg: "Avvio sequenza di failover: spegnimento K8s e verifica gate..."

    # Step 1.1: Cordon
    - name: "🛡️ Cordon globale nodi Talos (Previene rescheduling dei pod)"
      command: kubectl cordon talos-cp-01 talos-cp-02 talos-cp-03
      register: cordon_result
      ignore_errors: true

    # Step 1.2: Checkpoint DB
    - name: "💾 Quiesce / Checkpoint Database PostgreSQL (CNPG)"
      command: >
        kubectl exec -n default -c postgres postgres-main-1 -- psql -U postgres -c "CHECKPOINT;"
      register: pg_checkpoint
      ignore_errors: true

    # Step 1.3: Segnale Shutdown Talos
    - name: "🔥 Invia segnale di spegnimento parallelo Talos OS"
      command: >
        talosctl shutdown --nodes {{ talos_nodes }} --endpoints {{ api_endpoint }} --force --wait=false
      register: shutdown_signal
      ignore_errors: true

    # Step 1.4: Gate 1 - Attesa discesa porte API Talos
    - name: "⏳ Gate 1.1: Attesa chiusura porte API Talos (Porta 50000)"
      wait_for:
        host: "{{ item }}"
        port: 50000
        state: stopped
        timeout: 90
      loop:
        - 10.10.20.141
        - 10.10.20.142
        - 10.10.20.143

    # Step 1.5: Gate 1.2 - Verifica chiusura API Server K8s
    - name: "⏳ Gate 1.2: Verifica chiusura API Server K8s (VIP 10.10.20.55:6443)"
      wait_for:
        host: "{{ k8s_vip }}"
        port: 6443
        state: stopped
        timeout: 30

    # Step 1.6: Gate 1.3 - Verifica chiusura Traefik Ingress
    - name: "⏳ Gate 1.3: Verifica chiusura Traefik Ingress (VIP 10.10.20.56:443)"
      wait_for:
        host: "{{ traefik_vip }}"
        port: 443
        state: stopped
        timeout: 30

    - name: "✅ Gate 1 Superato: Cluster Kubernetes e Ingress ufficialmente OFFLINE"
      debug:
        msg: "Kubernetes è completamente spento. Nessun rischio di split-brain o contesa storage."

# ==============================================================================
# FASE 2: GESTIONE JELLYFIN LXC & MIRROR SYNC (COPIA SPECULARE) VERSO TRUENAS
# ==============================================================================
- name: "🎬 FASE 2: Stop LXC Jellyfin (2200) e Mirror Sync Dati verso TrueNAS"
  hosts: localhost
  gather_facts: no
  vars:
    pve3_ip: "10.10.10.31"
    lxc_id: "2200"
    lxc_data_path: "/rpool/data/jellyfin-db/"
    nfs_db_target: "/mnt/pve/k8s-arr/servarr-jellyfin-db/"
  tasks:
    - name: "Verifica se il container LXC {{ lxc_id }} è presente su PVE3"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve3_ip }} "pct status {{ lxc_id }}"
      register: lxc_status
      ignore_errors: true
      changed_when: false

    - name: "Gestione arresto Jellyfin LXC (se in esecuzione)"
      when:
        - lxc_status.rc == 0
        - "'status: running' in lxc_status.stdout"
      block:
        - name: "🛑 Arresto pulito del demone Jellyfin nell'LXC (Flush transazioni WAL su jellyfin.db)"
          shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve3_ip }} "pct exec {{ lxc_id }} -- systemctl stop jellyfin"
          ignore_errors: true

        - name: "Attesa assestamento SQLite (3 secondi)"
          pause:
            seconds: 3

        - name: "🛑 Arresto del container LXC {{ lxc_id }}"
          shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve3_ip }} "pct shutdown {{ lxc_id }}"
          register: pct_shutdown_res

        - name: "Attesa spegnimento effettivo LXC {{ lxc_id }}"
          shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve3_ip }} "pct status {{ lxc_id }}"
          register: pct_check
          until: "'status: stopped' in pct_check.stdout"
          retries: 15
          delay: 2

    - name: "🔄 Mirror Sync: Copia speculare cartella data (jellyfin.db) su TrueNAS NFS"
      shell: ssh -o BatchMode=yes root@{{ pve3_ip }} "rsync -av --delete {{ lxc_data_path }} {{ nfs_db_target }}"
      register: rsync_data_res

    - name: "🔧 Assicura permessi corretti UID/GID 1000 su TrueNAS per Jellyfin DB"
      shell: ssh -o BatchMode=yes root@{{ pve3_ip }} "chown -R 1000:1000 {{ nfs_db_target }} && chmod -R 775 {{ nfs_db_target }}"
      ignore_errors: true

    - name: "⏳ Gate 2: Verifica presenza e integrità jellyfin.db su TrueNAS"
      shell: ssh -o BatchMode=yes root@{{ pve3_ip }} "test -f {{ nfs_db_target }}jellyfin.db && ls -lh {{ nfs_db_target }}jellyfin.db"
      register: db_check
      failed_when: db_check.rc != 0

    - name: "✅ Gate 2 Superato: Jellyfin DB verificato e sincronizzato"
      debug:
        msg: "Database Jellyfin pronto su TrueNAS: {{ db_check.stdout }}"

# ==============================================================================
# FASE 3: PREPARAZIONE STORAGE ISOLATO JELLYFIN 12 E TUNING HARDWARE TRUENAS
# ==============================================================================
- name: "🛡️ FASE 3: Preparazione Storage Isolato Jellyfin 12 (-truenas) e Tuning AMD Vega / LAN"
  hosts: truenas
  gather_facts: no
  become: true
  tasks:
    - name: "🧹 Clean-Slate: rimozione preventiva directory temporanee Jellyfin Failover precedenti"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas
        - /mnt/stripe/k8s-arr/servarr-jellyfin-db-truenas

    - name: "📋 Copia locale rapida da produzione a directory segregate TrueNAS"
      command: "{{ item }}"
      loop:
        - "cp -a /mnt/stripe/k8s-arr/servarr-jellyfin-config /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas"
        - "cp -a /mnt/stripe/k8s-arr/servarr-jellyfin-db /mnt/stripe/k8s-arr/servarr-jellyfin-db-truenas"

    - name: "🎬 Adattamento encoding.xml per GPU AMD Radeon Vega (VA-API /dev/dri/renderD128, AV1 disabilitato)"
      copy:
        dest: /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas/encoding.xml
        owner: "1000"
        group: "1000"
        mode: "0664"
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <EncodingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <HardwareAccelerationType>vaapi</HardwareAccelerationType>
            <VaapiDevice>/dev/dri/renderD128</VaapiDevice>
            <EnableDecodingColorDepth10Hevc>true</EnableDecodingColorDepth10Hevc>
            <EnableDecodingColorDepth10Vp9>true</EnableDecodingColorDepth10Vp9>
            <EnableDecodingColorDepth10Av1>false</EnableDecodingColorDepth10Av1>
            <EnableEnhancedNvdecDecoder>false</EnableEnhancedNvdecDecoder>
            <EnableTonemapping>true</EnableTonemapping>
            <EnableVppTonemapping>false</EnableVppTonemapping>
          </EncodingOptions>

    - name: "🌐 Adattamento network.xml (Abilita Remote Access e Subnet LAN 10.10.0.0/16 anti-403)"
      copy:
        dest: /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas/network.xml
        owner: "1000"
        group: "1000"
        mode: "0664"
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <InternalHttpPort>8096</InternalHttpPort>
            <InternalHttpsPort>8920</InternalHttpsPort>
            <PublicHttpPort>8096</PublicHttpPort>
            <PublicHttpsPort>8920</PublicHttpsPort>
            <EnableRemoteAccess>true</EnableRemoteAccess>
            <LocalNetworkSubnets>
              <string>10.10.0.0/16</string>
            </LocalNetworkSubnets>
          </NetworkConfiguration>

    - name: "🔧 Normalizzazione permessi e proprietà (1000:1000 / 0775) sui percorsi isolati TrueNAS"
      file:
        path: "{{ item }}"
        owner: "1000"
        group: "1000"
        mode: "0775"
        recurse: yes
      loop:
        - /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas
        - /mnt/stripe/k8s-arr/servarr-jellyfin-db-truenas

    - name: "⏳ Gate 3: Verifica esistenza file di configurazione e database Jellyfin Failover"
      command: >
        test -f /mnt/stripe/k8s-arr/servarr-jellyfin-db-truenas/jellyfin.db &&
        test -f /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas/encoding.xml &&
        test -f /mnt/stripe/k8s-arr/servarr-jellyfin-config-truenas/network.xml
      register: jellyfin_failover_check
      failed_when: jellyfin_failover_check.rc != 0
      changed_when: false

    - name: "✅ Gate 3 Superato: Storage segregato Jellyfin 12 pronto e adattato per AMD Vega"
      debug:
        msg: "Directory servarr-jellyfin-*-truenas pronte e isolate. Nessuna modifica verrà applicata allo storage di produzione."

# ==============================================================================
# FASE 4: SHUTDOWN ORDINATO NODI FISICI PROXMOX VE (pve3, pve2, pve1)
# ==============================================================================
- name: "🔌 FASE 4: Shutdown Fisico Hypervisor Proxmox VE"
  hosts: localhost
  gather_facts: no
  vars:
    pve_satellites:
      - 10.10.10.31 # pve3
      - 10.10.10.21 # pve2
    pve_master: "10.10.10.11" # pve1
  tasks:
    - name: "Verifica stato VM Talos su hypervisor Proxmox"
      shell: |
        ssh -o BatchMode=yes -o ConnectTimeout=3 root@10.10.10.11 "qm status 1300" || true
        ssh -o BatchMode=yes -o ConnectTimeout=3 root@10.10.10.21 "qm status 2300" || true
        ssh -o BatchMode=yes -o ConnectTimeout=3 root@10.10.10.31 "qm status 3200" || true
      register: vm_check
      changed_when: false

    - name: "Invia segnale di spegnimento ACPI ai nodi Satellite (PVE3, PVE2)"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ item }} "shutdown -h now"
      loop: "{{ pve_satellites }}"
      ignore_errors: true

    - name: "Invia segnale di spegnimento ACPI al nodo Master (PVE1)"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 root@{{ pve_master }} "shutdown -h now"
      ignore_errors: true

    - name: "⏳ Gate 4.1: Attesa spegnimento effettivo nodi fisici Proxmox (Porta SSH 22 STOPPED)"
      wait_for:
        host: "{{ item }}"
        port: 22
        state: stopped
        timeout: 120
      loop:
        - 10.10.10.31
        - 10.10.10.21
        - 10.10.10.11

    - name: "⏳ Gate 4.2: Verifica spegnimento WebUI Proxmox (Porta 8006 STOPPED)"
      wait_for:
        host: "{{ item }}"
        port: 8006
        state: stopped
        timeout: 30
      loop:
        - 10.10.10.31
        - 10.10.10.21
        - 10.10.10.11

    - name: "✅ Gate 4 Superato: Cluster Proxmox VE 100% DISATTIVO"
      debug:
        msg: "Tutti e 3 i server fisici Proxmox (pve1, pve2, pve3) sono spenti."

# ==============================================================================
# FASE 5: AVVIO E VALIDAZIONE DELLO STACK DOCKER COMPOSE SU TRUENAS
# ==============================================================================
- name: "🚀 FASE 5: Avvio dello Stack Docker Compose di Riserva su TrueNAS"
  hosts: truenas
  gather_facts: no
  become: true
  vars:
    compose_dir: "/mnt/stripe/compose/arr"
    repo_compose_local_path: "{{ playbook_dir }}/../../../servarr/compose/"
  tasks:
    - name: "Verifica stato pool ZFS su TrueNAS (stripe & oliraid)"
      command: zpool status -x
      register: zpool_check
      failed_when: "'all pools are healthy' not in zpool_check.stdout"
      changed_when: false

    - name: "Assicura esistenza directory compose su TrueNAS"
      file:
        path: "{{ compose_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: "Copia dichiarativa file stack da repository a TrueNAS"
      copy:
        src: "{{ item.src }}"
        dest: "{{ compose_dir }}/{{ item.dest }}"
        owner: "1000"
        group: "1000"
        mode: "{{ item.mode | default('0664') }}"
      loop:
        - { src: "{{ repo_compose_local_path }}docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "{{ repo_compose_local_path }}load_indexers.py", dest: "load_indexers.py", mode: "0775" }
        - { src: "{{ repo_compose_local_path }}indexers_dump.json", dest: "indexers_dump.json" }
        - { src: "{{ repo_compose_local_path }}.env.example", dest: ".env" }

    - name: "Sincronizza configurazione Homepage per TrueNAS Failover"
      copy:
        src: "{{ repo_compose_local_path }}homepage-config-truenas/"
        dest: "{{ compose_dir }}/homepage-config-truenas/"
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: "🚀 Avvio Stack Docker Compose (docker compose up -d)"
      command: docker compose up -d
      args:
        chdir: "{{ compose_dir }}"
      register: docker_up_res

    - name: "Attesa assestamento container e init bootstrap (10 secondi)"
      pause:
        seconds: 10

    - name: "⏳ Gate 5.1: Ispezione esito init-arr-bootstrap"
      command: docker inspect -f '{% raw %}{{.State.ExitCode}}{% endraw %}' init-arr-bootstrap
      register: init_exit_code
      failed_when: init_exit_code.stdout != "0"
      changed_when: false

    - name: "⏳ Gate 5.2: Attesa disponibilità qBittorrent WebUI (Porta 8080)"
      wait_for:
        host: 10.10.10.50
        port: 8080
        state: started
        timeout: 60

    - name: "⏳ Gate 5.3: Attesa disponibilità Jellyfin WebUI (Porta 8096)"
      wait_for:
        host: 10.10.10.50
        port: 8096
        state: started
        timeout: 60

    - name: "⏳ Gate 5.4: Attesa disponibilità Prowlarr WebUI (Porta 9696)"
      wait_for:
        host: 10.10.10.50
        port: 9696
        state: started
        timeout: 60

    - name: "⏳ Gate 5.5: Attesa disponibilità Homepage Dashboard WebUI (Porta 3000)"
      wait_for:
        host: 10.10.10.50
        port: 3000
        state: started
        timeout: 60

    - name: "Attesa completamento caricatore indexer (15 secondi)"
      pause:
        seconds: 15

    - name: "Ispezione log caricatore indexer (prowlarr-indexers-loader)"
      command: docker logs prowlarr-indexers-loader
      register: loader_logs
      ignore_errors: true
      changed_when: false

    - name: "🏁 FAILOVER A SOLO TRUENAS COMPLETATO CON SUCCESSO"
      debug:
        msg: |
          ============================================================
          🎉 MIGRAZIONE A SOLO TRUENAS COMPLETATA CON SUCCESSO!
          ============================================================
          - Kubernetes:    OFFLINE (Cordoned & Clean Checkpoint)
          - Proxmox (PVE): OFFLINE (pve1, pve2, pve3 spenti)
          - Storage ZFS:   Percorsi -truenas isolati (Produzione intatta)
          - Failover Apps: ONLINE su TrueNAS SCALE (10.10.10.50)
          ------------------------------------------------------------
          🔗 Homepage Dashboard: http://10.10.10.50:3000 (Failover Dashboard LAN)
          🔗 qBittorrent WebUI:  http://10.10.10.50:8080 (Porta BT: 30661)
          🔗 Jellyfin WebUI:     http://10.10.10.50:8096 (AMD Vega VAAPI)
          🔗 Prowlarr WebUI:     http://10.10.10.50:9696 (SQLite)
          ============================================================
          Dettaglio Loader Indexer:
          {{ loader_logs.stdout_lines | default(['N/A']) | join('\n') }}
