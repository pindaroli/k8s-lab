---
# ==============================================================================
# 🔌 ENSURE STORAGE OFF: FLUSH E SPEGNIMENTO IDEMPOTENTE TRUENAS SCALE BARE METAL
# ==============================================================================
# 1. Probe Idempotente porta 22 su TrueNAS (10.10.20.50)
# 2. Se già offline: skip immediato in 1 secondo (zero errori)
# 3. Se online: sync buffer ZFS, comando shutdown ACPI e attesa porta 22 STOPPED
# ==============================================================================

- name: "🔌 ENSURE STORAGE OFF: Spegnimento Fisico TrueNAS SCALE Bare Metal"
  tags: [truenas, storage_off]
  hosts: localhost
  gather_facts: no
  vars:
    truenas_ip: "10.10.20.50"
    truenas_ssh_user: "olindo"
  tasks:
    - name: "🔔 Inizio verifica / spegnimento Storage TrueNAS"
      debug:
        msg: "Verifica stato per spegnimento sicuro di TrueNAS..."

    - name: "🔍 Probe Idempotente: Verifica se TrueNAS è ancora acceso (Porta 22)"
      wait_for:
        host: "{{ truenas_ip }}"
        port: 22
        state: started
        timeout: 2
      register: truenas_shutdown_probe
      failed_when: false

    - name: "Definisci stato rilevamento TrueNAS"
      set_fact:
        truenas_is_online: "{{ 'port' in truenas_shutdown_probe and 'Timeout' not in (truenas_shutdown_probe.msg | default('')) }}"

    - name: "ℹ️ Stato rilevamento TrueNAS"
      debug:
        msg: "{{ 'TrueNAS ONLINE: procedo con sync e spegnimento' if truenas_is_online else 'TrueNAS GIÀ OFFLINE: skip sync, shutdown, gate e notifica' }}"

    - name: "💾 Flush preventivo buffer I/O ZFS su TrueNAS (se online)"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 {{ truenas_ssh_user }}@{{ truenas_ip }} "sync"
      when: truenas_is_online
      ignore_errors: true

    - name: "🛑 Invio comando di spegnimento ACPI a TrueNAS (se online)"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 {{ truenas_ssh_user }}@{{ truenas_ip }} "sudo -n shutdown -h now"
      when: truenas_is_online
      ignore_errors: true

    - name: "⏳ Gate Finale: Polling spegnimento TrueNAS (Porta SSH 22 STOPPED)"
      wait_for:
        host: "{{ truenas_ip }}"
        port: 22
        state: stopped
        timeout: 5
      register: truenas_stopped_check
      until: truenas_stopped_check is succeeded
      retries: 30
      delay: 5
      when: truenas_is_online

    - name: "✅ Gate Finale Superato: TrueNAS SCALE è completamente spento"
      debug:
        msg: "TrueNAS Bare Metal è spento. Storage disattivato."
      when: truenas_is_online

    - name: "🔔 Notifica Telegram: TrueNAS Spento"
      command: >
        bash -c 'source {{ playbook_dir }}/../../../scripts/infrastructure/utils.sh && send_telegram "⚫ <b>TrueNAS SCALE Spento</b>: Dischi ZFS e storage bare metal offline"'
      when: truenas_is_online
      changed_when: false
