---
- name: Sync DHCP Reservations from rete.json to OPNsense
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../vars/opnsense_secrets.yml"

  vars:
    opnsense_url: "https://192.168.2.254"
    opnsense_api_key: "{{ api_key }}"
    opnsense_api_secret: "{{ api_secret }}"
    rete_json_path: "{{ playbook_dir }}/../../rete.json"
    extract_script: "{{ playbook_dir }}/scripts/extract_dhcp_from_rete_json.py"

  tasks:
    - name: Extract DHCP reservations from rete.json
      command: python3 "{{ extract_script }}" --file "{{ rete_json_path }}"
      register: dhcp_json
      changed_when: false

    - name: Parse reservations
      set_fact:
        reservations: "{{ dhcp_json.stdout | from_json }}"

    - name: Show reservations to apply
      debug:
        msg: "{{ item.hostname }} → {{ item.ip }} ({{ item.mac }}) on {{ item.interface }}"
      loop: "{{ reservations }}"

    - name: Apply DHCP static mappings to OPNsense
      ansibleguy.opnsense.dhcp_reservation:
        firewall: "192.168.100.1"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        ssl_verify: false
        subnet: "10.10.20.0/24"
        mac: "{{ item.mac }}"
        ip: "{{ item.ip }}"
        hostname: "{{ item.hostname }}"
        description: "{{ item.descr | truncate(255, True, '') }}"
        state: present
      loop: "{{ reservations | selectattr('interface', 'equalto', 'opt2') | list }}"
      no_log: true
