---
- name: Add Port 8 to VLAN Default on Extreme EXOS and Save
  hosts: switches
  gather_facts: no


  tasks:
    - name: 1. Add Port 8 untagged to VLAN Default on Extreme EXOS
      extreme.exos.exos_config:
        lines:
          - configure vlan Default add ports 8 untagged
      register: config_result

    - name: 2. Display configuration result
      ansible.builtin.debug:
        var: config_result
