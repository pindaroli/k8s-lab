# ============================================================
# Headlamp — Kubernetes Web UI Dashboard Helm Values
# Repo: https://kubernetes-sigs.github.io/headlamp/
# Homelab: pindaroli / Talos Linux v1.12.0
# Namespace: headlamp
# Auth: in-cluster automatic (behind OAuth2 Proxy / LAN)
# ============================================================

replicaCount: 1

image:
  registry: ghcr.io
  repository: headlamp-k8s/headlamp
  pullPolicy: IfNotPresent
  # Tag lasciato vuoto per seguire automaticamente appVersion della chart

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: headlamp

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

config:
  inCluster: true
  inClusterContextName: "talos-cluster"
  sessionTTL: 86400
  # Autenticazione automatica con il ServiceAccount in-cluster
  unsafeUseServiceAccountToken: true
  oidc:
    secret:
      create: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Ingress nativo Kubernetes disabilitato a favore di Traefik IngressRoute nativo
ingress:
  enabled: false

# Definizione dichiarativa IngressRoute Traefik Split-Horizon gestita da Helm (Anti-Loose-YAML Guard)
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: headlamp-ingress-route
      namespace: headlamp
    spec:
      entryPoints:
        - websecure
      routes:
        # 1. Accesso Esterno: protetto da Google OAuth2 via Traefik Middleware
        - match: Host(`headlamp.pindaroli.org`)
          kind: Rule
          services:
            - name: headlamp
              port: 80
          middlewares:
            - name: oauth2-auth
              namespace: traefik
        # 2. Accesso Interno LAN: accesso fidato diretto senza OAuth2
        - match: Host(`headlamp`) || Host(`headlamp-internal.pindaroli.org`)
          kind: Rule
          services:
            - name: headlamp
              port: 80
      tls:
        secretName: pindaroli-wildcard-tls
