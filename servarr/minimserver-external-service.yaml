apiVersion: v1
kind: Service
metadata:
  name: minimserver-external-svc
  namespace: arr
spec:
  ports:
    - protocol: TCP
      port: 9790
      targetPort: 9790
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minimserver-external-svc
  namespace: arr
subsets:
  - addresses:
      - ip: "10.10.20.50"
    ports:
      - port: 9790
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minimserver-ingress-route
  namespace: arr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minimserver.pindaroli.org`)
      kind: Rule
      services:
        - name: minimserver-external-svc
          port: 9790
      middlewares:
        - name: oauth2-auth
          namespace: traefik
    - match: Host(`minimserver`) || Host(`minimserver-internal.pindaroli.org`)
      kind: Rule
      services:
        - name: minimserver-external-svc
          port: 9790
  tls:
    secretName: pindaroli-wildcard-tls
