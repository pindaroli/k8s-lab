apiVersion: v1
kind: Service
metadata:
  name: jellyfin-external-svc
  namespace: arr
spec:
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jellyfin-external-svc
  namespace: arr
subsets:
  - addresses:
      - ip: "10.10.20.50"
    ports:
      - port: 8096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-external
  namespace: arr
spec:
  entryPoints:
    - websecure
  routes:
    # External / Public: OAuth Protected
    - match: Host(`jellyfin.pindaroli.org`)
      kind: Rule
      services:
        - name: jellyfin-external-svc
          port: 8096
      middlewares:
        - name: oauth2-auth
          namespace: traefik
    # Internal / Short: Direct Access (LAN fidata, no Basic Auth, no OAuth2)
    - match: Host(`jellyfin`) || Host(`jellyfin-internal.pindaroli.org`)
      kind: Rule
      services:
        - name: jellyfin-external-svc
          port: 8096
  tls:
    secretName: pindaroli-wildcard-tls
