prowlarr:
  initContainers:
    - name: wait-for-db
      image: busybox:1.36.1
      command: ['sh', '-c', 'until nc -z -w 2 postgres-main-rw.cnpg-system.svc.cluster.local 5432; do echo "Waiting for PostgreSQL to be ready..."; sleep 2; done']
  image:
    repository: ghcr.io/hotio/prowlarr
    tag: "release-2.5.2.5491"
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Rome
    # Hotio/NET Core uses double underscores for config mapping
    PROWLARR__POSTGRES__HOST: postgres-main-rw.cnpg-system.svc.cluster.local # Stable Service ClusterIP (Bypasses DNS/VPN issues)
    PROWLARR__POSTGRES__PORT: "5432"
    PROWLARR__POSTGRES__MAINDB: prowlarr
    PROWLARR__POSTGRES__LOGDB: prowlarr  # Using same DB for logs (simplification)
    PROWLARR__POSTGRES__USER: prowlarr
  envFrom:
    - secretRef:
        name: servarr-db-secrets
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: csi-nfs-stripe-arr-conf
    createInitContainer: false
    config:
      enabled: true
    media:
      enabled: true
      existingClaim: servarr-jellyfin-media
  monitoring:
    enabled: true
  extraContainers:
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
      args:
        - prowlarr
      env:
        - name: URL
          value: "http://localhost:9696"
        - name: APIKEY
          valueFrom:
            secretKeyRef:
              name: servarr-api-keys
              key: prowlarr-api-key
      ports:
        - name: metrics
          containerPort: 9707
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

