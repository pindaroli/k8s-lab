## Autobrr - Torrent Monitor and Automation
autobrr:
  enabled: true
  provisioning:
    enabled: true
    secrets:
      admin: "servarr-api-keys"
      qbittorrent: "servarr-api-keys"
      telegram: "servarr-api-keys"
      prowlarr: "servarr-api-keys"
    telegram:
      chatId: "-100123456789"
    clients:
      - name: "qBittorrent-GEMINI"
        type: "QBITTORRENT"
        enabled: true
        host: "http://servarr-qbittorrent-web:8080"
        port: 0
        tls: false
        tls_skip_verify: true
        username: "SECRET_QBITTORRENT_USERNAME"
        password: "SECRET_QBITTORRENT_PASSWORD"
        settings:
          basic:
            auth: true
            username: "SECRET_QBITTORRENT_USERNAME"
            password: "SECRET_QBITTORRENT_PASSWORD"
          rules:
            enabled: true
            max_active_downloads: 3
            ignore_slow_torrents: true
            ignore_slow_torrents_condition: "MAX_DOWNLOADS_REACHED"
    notifications:
      - name: "Telegram-Alerts"
        type: "TELEGRAM"
        enabled: true
        token: "SECRET_TELEGRAM_TOKEN"
        targets: "SECRET_TELEGRAM_CHATID"
        events: ["approved", "rejected", "error", "irc_down", "irc_up"]
    # indexers: lista di indexer da creare via API /api/indexer
    # --- COME COSTRUIRE L'URL TORZNAB DA PROWLARR ---
    # In Prowlarr: Indexers > fai clic sul feed dell'indexer > copia URL
    # L'URL ha la forma: https://prowlarr.local/<id>/api?apikey=<key>&extended=1&t=search
    # Separa in due parti:
    #   url:    https://prowlarr.local/<id>/api       (base, senza query string)
    #   apikey: usa il placeholder SECRET_PROWLARR_APIKEY  (sostituito a runtime dal Job)
    # Internamente al cluster usa il DNS K8s: http://servarr-prowlarr:9696/<id>/api
    # Per ogni indexer diverso in Prowlarr cambia solo il numero <id> nell'URL.
    indexers:
      - name: "Prowlarr-Generic-Torznab"
        identifier: "generic-torznab"
        implementation: "torznab"
        enabled: true
        settings:
          url: "http://servarr-prowlarr:9696/1/api"
          apikey: "SECRET_PROWLARR_APIKEY"
          download_type: "torrent"
    filters:
      - name: "GEMINI-Movies-Racing"
        enabled: true
        priority: 100
        use_regex: true
        resolutions: ["1080p", "2160p"]
        codecs: ["H.264", "HEVC", "x265"]
        sources: ["BluRay", "WEB-DL"]
        containers: ["MKV"]
        origins: ["INTERNAL"]
        years: "2023-2030"
        match_releases: ".*(FRENCH|MULTi|TRUEFRENCH).*"
        except_releases: ".*(3D|REMUX|Stereo).*"
        indexers: ["Prowlarr-Generic-Torznab"]
  replicaCount: 1
  initContainers:
    - name: wait-for-db
      image: busybox:1.36.1
      command: ['sh', '-c', 'until nc -z -w 2 postgres-main-rw.cnpg-system.svc.cluster.local 5432; do echo "Waiting for PostgreSQL to be ready..."; sleep 2; done']
  image:
    repository: ghcr.io/autobrr/autobrr
    tag: "v1.80.0"
  env:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Rome
    AUTOBRR__DATABASE_TYPE: postgres
    AUTOBRR__POSTGRES_HOST: postgres-main-rw.cnpg-system.svc.cluster.local
    AUTOBRR__POSTGRES_PORT: "5432"
    AUTOBRR__POSTGRES_DATABASE: autobrr
    AUTOBRR__POSTGRES_USER: autobrr
  envFrom:
    - secretRef:
        name: servarr-db-secrets
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: csi-nfs-stripe-arr-conf
    existingClaim: ""
    size: 1Gi

