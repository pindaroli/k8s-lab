# Foglio Valori Helm per Kuadrant MCP Gateway (k8s-lab)

image:
  repository: ghcr.io/kuadrant/mcp-gateway
  tag: "v0.9.0"
  pullPolicy: IfNotPresent

replicas: 1

gateway:
  publicHost: "mcp-internal.pindaroli.org"
  parentGateway:
    name: "traefik-gateway"
    namespace: "traefik"

signingKey:
  secretName: "mcp-gateway-signing-key"
  secretKey: "GATEWAY_SIGNING_KEY"

logLevel: -4
enableURLElicitation: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Catalogo dei server MCP federati sotto /mcp
servers:
  - name: github
    url: "http://mcp-github-mcp-proxy.mcp-system.svc.cluster.local:8080/mcp"
    hostname: "mcp-github-mcp-proxy.mcp-system.svc.cluster.local"
    enabled: true
    prefix: "github_"
    ingress:
      enabled: true
      host: "github-mcp-internal.pindaroli.org"
      port: 8080
    toolhive:
      enabled: true
      name: github-mcp
      image: ghcr.io/github/github-mcp-server
      transport: stdio
      proxyPort: 8080
      secrets:
        - name: github-mcp-credentials
          key: GITHUB_PERSONAL_ACCESS_TOKEN
          targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
      env:
        - name: GITHUB_API_URL
          value: https://api.github.com
        - name: LOG_LEVEL
          value: info
      resources:
        limits:
          cpu: "300m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"

  - name: truenas
    url: "http://mcp-truenas-mcp-proxy.mcp-system.svc.cluster.local:8080/mcp"
    hostname: "mcp-truenas-mcp-proxy.mcp-system.svc.cluster.local"
    enabled: true
    prefix: "truenas_"
    ingress:
      enabled: true
      host: "truenas-mcp-internal.pindaroli.org"
      port: 8080
    toolhive:
      enabled: true
      name: truenas-mcp
      image: ghcr.io/pindaroli/truenas-master-mcp:latest
      transport: stdio
      proxyPort: 8080
      secrets:
        - name: truenas-mcp-credentials
          key: TRUENAS_API_KEY
          targetEnvName: TRUENAS_API_KEY
      env:
        - name: TRUENAS_SERVER_URL
          value: "https://10.10.10.50"
        - name: TRUENAS_VERIFY_SSL
          value: "false"
        - name: TRUENAS_TIMEOUT
          value: "30"
        - name: TRUENAS_VERSION
          value: "scale"
      resources:
        limits:
          cpu: "300m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"

  - name: opnsense
    url: "http://mcp-opnsense-mcp-proxy.mcp-system.svc.cluster.local:8080/mcp"
    hostname: "mcp-opnsense-mcp-proxy.mcp-system.svc.cluster.local"
    enabled: true
    prefix: "opnsense_"
    ingress:
      enabled: true
      host: "opnsense-mcp-internal.pindaroli.org"
      port: 8080
    toolhive:
      enabled: true
      name: opnsense-mcp
      image: ghcr.io/pindaroli/opnsense-mcp:latest
      transport: stdio
      proxyPort: 8080
      secrets:
        - name: opnsense-mcp-api-key
          key: OPNSENSE_API_KEY
          targetEnvName: OPNSENSE_API_KEY
        - name: opnsense-mcp-api-secret
          key: OPNSENSE_API_SECRET
          targetEnvName: OPNSENSE_API_SECRET
      env:
        - name: OPNSENSE_URL
          value: "https://192.168.100.1"
        - name: OPNSENSE_VERIFY_SSL
          value: "false"
      resources:
        limits:
          cpu: "300m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"

  - name: talos
    url: "http://mcp-talos-mcp-proxy.mcp-system.svc.cluster.local:8080/mcp"
    hostname: "mcp-talos-mcp-proxy.mcp-system.svc.cluster.local"
    enabled: true
    prefix: "talos_"
    ingress:
      enabled: true
      host: "talos-mcp-internal.pindaroli.org"
      port: 8080
    toolhive:
      enabled: true
      name: talos-mcp
      image: ghcr.io/pindaroli/talos-mcp:latest
      transport: stdio
      proxyPort: 8080
      podTemplateSpec:
        spec:
          volumes:
            - name: talosconfig-vol
              secret:
                secretName: talos-mcp-credentials
          containers:
            - name: mcp
              volumeMounts:
                - name: talosconfig-vol
                  mountPath: /etc/talos
                  readOnly: true
      env:
        - name: TALOSCONFIG
          value: "/etc/talos/talosconfig"
        - name: TALOS_MCP_AUDIT_LOG_PATH
          value: "/dev/null"
      resources:
        limits:
          cpu: "300m"
          memory: "256Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"

  - name: gemini-deepsearch
    url: "http://mcp-gemini-deepsearch-mcp-proxy.mcp-system.svc.cluster.local:8080/mcp"
    hostname: "mcp-gemini-deepsearch-mcp-proxy.mcp-system.svc.cluster.local"
    enabled: true
    prefix: "deepsearch_"
    ingress:
      enabled: true
      host: "deepsearch-mcp-internal.pindaroli.org"
      port: 8080
    toolhive:
      enabled: true
      name: gemini-deepsearch-mcp
      image: ghcr.io/pindaroli/gemini-deepsearch-mcp:latest
      transport: stdio
      proxyPort: 8080
      secrets:
        - name: gemini-deepsearch-credentials
          key: GEMINI_API_KEY
          targetEnvName: GEMINI_API_KEY
      env:
        - name: GEMINI_FLASH_MODEL
          value: "gemini-3.5-flash"
        - name: GEMINI_PRO_MODEL
          value: "gemini-2.5-pro"
      resources:
        limits:
          cpu: "500m"
          memory: "1Gi"
        requests:
          cpu: "100m"
          memory: "256Mi"

# Configurazione MCP Inspector (Web UI e File System Access)
inspector:
  enabled: false
  image:
    repository: ghcr.io/modelcontextprotocol/inspector
    tag: "latest"
    pullPolicy: IfNotPresent
  env:
    ALLOWED_ORIGINS: "https://mcp-ui.pindaroli.org,https://mcp-ui-internal.pindaroli.org,http://localhost:6274,http://127.0.0.1:6274"
  nfsMounts:
    - name: nfs-media
      server: 10.10.10.50
      path: /mnt/oliraid/arrdata/media
      mountPath: /mnt/media
    - name: nfs-classical
      server: 10.10.10.50
      path: /mnt/oliraid/arrdata/classical
      mountPath: /mnt/classical
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
